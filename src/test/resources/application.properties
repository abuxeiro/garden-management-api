spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/garden_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

weather.api.url=https://api.open-meteo.com/v1/forecast
weather.api.latitude=42.59548309609141
weather.api.longitude=-8.953329938730201
weather.api.current-fields=temperature_2m,relative_humidity_2m
weather.scheduler.fixed-rate-ms=60000
